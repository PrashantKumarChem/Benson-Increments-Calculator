name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  data:
    name: Increment data
    runs-on: ubuntu-latest
    steps:
      # A shallow clone is enough. The version check below regenerates the
      # version from the working tree rather than comparing against the base of
      # the pull request, so there is no history for it to need.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Checks what a contributor can actually get wrong: two columns per file,
      # every value a number or a range, no duplicate or blank group names, the
      # filename convention, and manifest.json matching what is on disk.
      - name: Validate CSV files
        run: python tools/validate_data.py

      # The manifest is generated, so a stale committed copy is a real fault:
      # the site would show categories that no longer match the data.
      - name: Confirm the manifest is current
        run: |
          python tools/build_data.py
          git diff --exit-code CSV_data_files/manifest.json

      # An asset the page requests without a version is one a returning visitor
      # can be served from cache while the rest of the page is current. That has
      # broken the site once already; a stale module can also change a value
      # silently, which is worse.
      - name: Confirm every asset is versioned
        run: python tools/validate_assets.py

      # The step above checks that the ten version slots agree with each other.
      # It cannot check the thing that actually takes the site down: that the
      # version moved at all. Change a file under assets/, leave the version
      # alone, and a returning visitor keeps a cached copy of the old file under
      # a string saying it is current.
      #
      # The version is generated from the assets now, so that is one diff rather
      # than an argument about letters. This is the same bargain the manifest
      # above strikes: regenerate the file, and fail if the committed copy is
      # not what the sources produce.
      #
      # It replaces a step that walked the whole history of index.html to prove
      # a hand-picked letter had never been used before - which was needed
      # because two branches had each bumped correctly against their own base
      # and landed on the same letter. A hash cannot do that: two branches that
      # change different bytes get different strings without having to know
      # about each other, and this runs on a push as well, because it no longer
      # needs a base to compare against.
      - name: Confirm the asset version matches the assets
        run: |
          python tools/build_version.py
          git diff --exit-code index.html

  calculator:
    name: Calculator behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Value parsing and the tally arithmetic, exercised against the real CSVs.
      - name: Run tests
        run: node --test tools/*.test.mjs

      # CSS has no compiler and fails quietly. A comment closed early once, fed
      # its own prose to the parser, and the browser's error recovery swallowed
      # the whole media query that followed - the tally panel stopped existing
      # on desktop. Every check in this file passed; a screenshot caught it.
      #
      # The tests above already run these checks against the stylesheet. This
      # step is here so that when the stylesheet is what broke, the job that
      # goes red says so by name.
      - name: Validate the stylesheet
        run: node tools/validate_css.mjs

      # The one step here that needs a browser, and the only one anywhere in
      # this repository that does.
      #
      # Every other check reads the source, which is why the faults that have
      # actually reached this site are the ones none of them can see: valid CSS
      # that parses, passes, and puts the calculator somewhere nobody can reach
      # it. That has happened twice, and a person looking at the page caught it
      # both times.
      #
      # It installs rather than the project declaring a dependency, because
      # `git clone && node --test tools/*.test.mjs` working on a clean machine
      # with nothing installed is a property worth keeping. The browser lives
      # here, in the runner, where it costs a contributor nothing.
      - name: Install a browser to render with
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Check the page actually renders
        run: node tools/check_render.mjs

  parity:
    name: Parity with the notebook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the notebook's dependencies
        run: pip install -r requirements.txt

      # Loads every increment twice - once with the notebook's own code, once
      # with the site's - and fails on any difference. Retire this job when the
      # notebook is retired.
      - name: Compare every increment
        run: node tools/check_parity.mjs
        env:
          PYTHON: python
