name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  data:
    name: Increment data
    runs-on: ubuntu-latest
    steps:
      # Full history: the version check below compares this branch against the
      # base of the pull request, and a shallow clone has no base to compare to.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Checks what a contributor can actually get wrong: two columns per file,
      # every value a number or a range, no duplicate or blank group names, the
      # filename convention, and manifest.json matching what is on disk.
      - name: Validate CSV files
        run: python tools/validate_data.py

      # The manifest is generated, so a stale committed copy is a real fault:
      # the site would show categories that no longer match the data.
      - name: Confirm the manifest is current
        run: |
          python tools/build_data.py
          git diff --exit-code CSV_data_files/manifest.json

      # An asset the page requests without a version is one a returning visitor
      # can be served from cache while the rest of the page is current. That has
      # broken the site once already; a stale module can also change a value
      # silently, which is worse.
      - name: Confirm every asset is versioned
        run: python tools/validate_assets.py

      # The step above checks that the version slots in index.html agree with
      # each other. It cannot check the thing that actually takes the site
      # down: that you moved them. Change a file under assets/, leave the
      # version alone, and every check in this file passes - while a returning
      # visitor keeps a cached copy of the old file under a string saying it is
      # current. That is the silent half of the failure the versioning exists
      # to prevent, and nothing here was looking for it.
      #
      # Only a pull request has a base to compare against, so this is skipped
      # on a push to main, where the comparison would be against the commit
      # that was just merged and would fail every time.
      - name: Confirm a change under assets/ comes with a version bump
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"

          if git diff --quiet "$base" HEAD -- assets/; then
            echo "Nothing under assets/ changed; no bump needed."
            exit 0
          fi

          here=$(git show HEAD:index.html | grep -o '?v=[^"]*' | sort -u)
          there=$(git show "$base":index.html | grep -o '?v=[^"]*' | sort -u)

          if [ "$here" = "$there" ]; then
            echo "These files under assets/ changed:"
            git diff --name-only "$base" HEAD -- assets/ | sed 's/^/  /'
            echo
            echo "But index.html still asks for $here, the same as ${{ github.base_ref }}."
            echo
            echo "Bump the version in index.html - every slot, they must agree."
            echo "It is a date; for a second release on the same day add a"
            echo "letter (2026-09-09b), since a value already in use is not a bump."
            echo "If reference.html exists on this branch, rerun"
            echo "  node tools/build_reference.mjs"
            echo "afterwards so the generated page follows."
            exit 1
          fi

          echo "assets/ changed and the version moved: $there -> $here"

  calculator:
    name: Calculator behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Value parsing and the tally arithmetic, exercised against the real CSVs.
      - name: Run tests
        run: node --test tools/*.test.mjs

      # CSS has no compiler and fails quietly. A comment closed early once, fed
      # its own prose to the parser, and the browser's error recovery swallowed
      # the whole media query that followed - the tally panel stopped existing
      # on desktop. Every check in this file passed; a screenshot caught it.
      #
      # The tests above already run these checks against the stylesheet. This
      # step is here so that when the stylesheet is what broke, the job that
      # goes red says so by name.
      - name: Validate the stylesheet
        run: node tools/validate_css.mjs

  parity:
    name: Parity with the notebook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the notebook's dependencies
        run: pip install -r requirements.txt

      # Loads every increment twice - once with the notebook's own code, once
      # with the site's - and fails on any difference. Retire this job when the
      # notebook is retired.
      - name: Compare every increment
        run: node tools/check_parity.mjs
        env:
          PYTHON: python
